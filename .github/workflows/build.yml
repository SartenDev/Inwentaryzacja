name: Build Application Inventory

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
          - os: macos-13       # Intel (x86_64)
            name: macos-intel
          - os: macos-14       # Apple Silicon (arm64)
            name: macos-arm

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm --onefile --name inwentaryzacja inwentaryzacja.py

      - name: Upload Windows executable
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: inwentaryzacja-windows
          path: dist/inwentaryzacja.exe

      - name: Upload Linux executable
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: inwentaryzacja-linux
          path: dist/inwentaryzacja

      - name: Upload macOS Intel executable
        if: matrix.name == 'macos-intel'
        uses: actions/upload-artifact@v4
        with:
          name: inwentaryzacja-macos-intel
          path: dist/inwentaryzacja

      - name: Upload macOS Apple Silicon executable
        if: matrix.name == 'macos-arm'
        uses: actions/upload-artifact@v4
        with:
          name: inwentaryzacja-macos-arm
          path: dist/inwentaryzacja

  universal-macos:
    name: Merge macOS binaries into universal2
    needs: build
    runs-on: macos-14
    steps:
      - name: Download Intel binary
        uses: actions/download-artifact@v4
        with:
          name: inwentaryzacja-macos-intel
          path: intel

      - name: Download Apple Silicon binary
        uses: actions/download-artifact@v4
        with:
          name: inwentaryzacja-macos-arm
          path: arm

      - name: Merge with lipo
        run: |
          chmod +x intel/inwentaryzacja arm/inwentaryzacja
          lipo -create -output inwentaryzacja-universal intel/inwentaryzacja arm/inwentaryzacja
          chmod +x inwentaryzacja-universal
          lipo -info inwentaryzacja-universal

      - name: Upload universal binary
        uses: actions/upload-artifact@v4
        with:
          name: inwentaryzacja-macos-universal
          path: inwentaryzacja-universal

  release:
    name: Publish GitHub Release
    needs: [build, universal-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files

      - name: Show downloaded files
        run: ls -R release-files

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Inwentaryzacja ${{ github.ref_name }}
          files: |
            release-files/inwentaryzacja-windows/inwentaryzacja.exe
            release-files/inwentaryzacja-linux/inwentaryzacja
            release-files/inwentaryzacja-macos-intel/inwentaryzacja
            release-files/inwentaryzacja-macos-arm/inwentaryzacja
            release-files/inwentaryzacja-macos-universal/inwentaryzacja-universal
          generate_release_notes: true
          fail_on_unmatched_files: true
